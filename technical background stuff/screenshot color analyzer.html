<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKLCH Lasso</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--text:#1d1d1b;--muted:#6b6a66;--line:#dcdad4;--accent:#2f6fed;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--panel:#1f1f1d;--text:#ecebe6;--muted:#9a9890;--line:#363531;--accent:#6c9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--panel:#1f1f1d;--text:#ecebe6;--muted:#9a9890;--line:#363531;--accent:#6c9bff;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px;max-width:1400px;margin:0 auto}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stage{position:relative;line-height:0;border-radius:8px;overflow:auto;max-height:75vh;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/16px 16px}
.stage canvas{display:block;width:100%;height:auto}
#ov{position:absolute;inset:0;cursor:crosshair;touch-action:none}
#drop{padding:60px 20px;text-align:center;color:var(--muted);line-height:1.5;border:2px dashed var(--line);border-radius:10px}
.sw{height:84px;border-radius:10px;border:1px solid var(--line);margin-bottom:10px}
.grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
.grid b{color:var(--muted);font-weight:500}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.muted{color:var(--muted);font-size:12px}
h3{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);cursor:pointer}
.row i{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);flex:none}
.row span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="bar">
      <button id="up">Open image…</button>
      <input id="file" type="file" accept="image/*" hidden>
      <button id="mFree" class="on">Freehand</button>
      <button id="mPoly">Polygon</button>
      <select id="op" title="How a new selection combines with the old one">
        <option value="set">Replace</option><option value="add">Add</option><option value="sub">Subtract</option>
      </select>
      <button id="clear">Clear</button>
    </div>
    <div id="drop">Drop a screenshot here, paste with Ctrl/Cmd+V, or click “Open image…”</div>
    <div class="stage" id="stage" hidden>
      <canvas id="base"></canvas>
      <canvas id="ov"></canvas>
    </div>
    <p class="muted" style="margin:8px 0 0">Freehand: drag. Polygon: click points, double-click or Enter to close, Esc to cancel. Shift = add, Alt = subtract.</p>
  </div>

  <div class="card">
    <div class="sw" id="sw"></div>
    <div class="grid">
      <b>L</b><span id="rL" class="mono">–</span>
      <b>C</b><span id="rC" class="mono">–</span>
      <b>h</b><span id="rH" class="mono">–</span>
      <b>hex</b><span id="rX" class="mono">–</span>
      <b>sRGB</b><span id="rS" class="mono">–</span>
      <b>lin RGB</b><span id="rLin" class="mono">–</span>
      <b>pixels</b><span id="rN" class="mono">–</span>
    </div>
    <div class="bar" style="margin:10px 0 0">
      <button id="cpy">Copy oklch()</button>
      <button id="save">Add to list</button>
    </div>
    <h3>Averaging space</h3>
    <select id="space" style="width:100%">
      <option value="lab">OKLab mean (perceptual)</option>
      <option value="lin">Linear-light RGB mean (physical)</option>
    </select>
    <h3>Saved samples <span class="muted">(click to copy)</span></h3>
    <div id="list"><span class="muted">Nothing saved yet.</span></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const base=$('base'),ov=$('ov'),bctx=base.getContext('2d',{willReadFrequently:true}),octx=ov.getContext('2d');
const mask=document.createElement('canvas'),mctx=mask.getContext('2d',{willReadFrequently:true});
const tint=document.createElement('canvas'),tctx=tint.getContext('2d');
let W=0,H=0,full=null,mode='free',path=[],drawing=false,hover=null,cur=null,saved=[];

/* ---- color math ---- */
const LUT=new Float32Array(256);for(let i=0;i<256;i++){const c=i/255;LUT[i]=c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)}
function lin2lab(r,g,b){
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),
        m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),
        s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  return[.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s]}
function lab2lin(L,a,b){
  const l=Math.pow(L+.3963377774*a+.2158037573*b,3),m=Math.pow(L-.1055613458*a-.0638541728*b,3),s=Math.pow(L-.0894841775*a-1.291485548*b,3);
  return[4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s]}
const enc=v=>{v=Math.min(1,Math.max(0,v));return Math.round(255*(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055))};
const hex=(r,g,b)=>'#'+[r,g,b].map(v=>enc(v).toString(16).padStart(2,'0')).join('');

/* ---- image loading ---- */
function loadBlob(blob){
  const url=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{
    W=im.naturalWidth;H=im.naturalHeight;
    for(const c of [base,ov,mask,tint]){c.width=W;c.height=H}
    bctx.drawImage(im,0,0);full=bctx.getImageData(0,0,W,H);
    mctx.clearRect(0,0,W,H);path=[];cur=null;
    $('drop').hidden=true;$('stage').hidden=false;render();showResult(null);URL.revokeObjectURL(url)};
  im.src=url}
$('up').onclick=()=>$('file').click();
$('file').onchange=e=>{if(e.target.files[0])loadBlob(e.target.files[0])};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));if(f)loadBlob(f)});
addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it)loadBlob(it.getAsFile())});

/* ---- selection ---- */
const setMode=m=>{mode=m;path=[];drawing=false;$('mFree').classList.toggle('on',m==='free');$('mPoly').classList.toggle('on',m==='poly');render()};
$('mFree').onclick=()=>setMode('free');$('mPoly').onclick=()=>setMode('poly');
$('clear').onclick=()=>{if(!full)return;mctx.clearRect(0,0,W,H);path=[];render();showResult(null)};
const pt=e=>{const r=ov.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
function commit(e){
  if(path.length<3){path=[];render();return}
  const op=e.shiftKey?'add':e.altKey?'sub':$('op').value;
  if(op==='set')mctx.clearRect(0,0,W,H);
  mctx.save();mctx.globalCompositeOperation=op==='sub'?'destination-out':'source-over';
  mctx.beginPath();path.forEach((p,i)=>i?mctx.lineTo(p[0],p[1]):mctx.moveTo(p[0],p[1]));mctx.closePath();mctx.fillStyle='#000';mctx.fill();mctx.restore();
  path=[];hover=null;render();compute()}
ov.addEventListener('pointerdown',e=>{
  if(!full)return;const p=pt(e);
  if(mode==='free'){ov.setPointerCapture(e.pointerId);drawing=true;path=[p]}
  else{
    if(path.length>2){const s=ov.getBoundingClientRect().width/W;if(Math.hypot(p[0]-path[0][0],p[1]-path[0][1])*s<10){commit(e);return}}
    path.push(p)}
  render()});
ov.addEventListener('pointermove',e=>{
  if(!full)return;const p=pt(e);
  if(mode==='free'&&drawing){path.push(p);render()}
  else if(mode==='poly'&&path.length){hover=p;render()}});
ov.addEventListener('pointerup',e=>{if(mode==='free'&&drawing){drawing=false;commit(e)}});
ov.addEventListener('dblclick',e=>{if(mode==='poly'&&path.length>2){path.pop();commit(e)}});
addEventListener('keydown',e=>{
  if(mode!=='poly')return;
  if(e.key==='Enter'&&path.length>2)commit(e);
  if(e.key==='Escape'){path=[];hover=null;render()}});

function render(){
  octx.clearRect(0,0,W,H);if(!full)return;
  // dim everything outside the selection
  const has=mctx.getImageData(0,0,W,H).data.some((v,i)=>i%4===3&&v>0);
  if(has){
    tctx.globalCompositeOperation='source-over';tctx.clearRect(0,0,W,H);tctx.fillStyle='rgba(0,0,0,.55)';tctx.fillRect(0,0,W,H);
    tctx.globalCompositeOperation='destination-out';tctx.drawImage(mask,0,0);
    octx.drawImage(tint,0,0)}
  if(path.length){
    const k=W/ov.getBoundingClientRect().width||1;
    const trace=()=>{octx.beginPath();path.forEach((p,i)=>i?octx.lineTo(p[0],p[1]):octx.moveTo(p[0],p[1]));if(mode==='poly'&&hover)octx.lineTo(hover[0],hover[1]);if(mode==='free')octx.closePath()};
    octx.lineJoin='round';octx.setLineDash([]);octx.strokeStyle='#000';octx.lineWidth=3*k;trace();octx.stroke();
    octx.strokeStyle='#fff';octx.lineWidth=1.2*k;octx.setLineDash([6*k,4*k]);trace();octx.stroke();octx.setLineDash([])}}
new ResizeObserver(()=>render()).observe(ov);

/* ---- averaging ---- */
function compute(){
  const m=mctx.getImageData(0,0,W,H).data,d=full.data,useLab=$('space').value==='lab';
  let n=0,a0=0,a1=0,a2=0;
  for(let i=0;i<m.length;i+=4){
    if(m[i+3]<128||d[i+3]<8)continue;
    const r=LUT[d[i]],g=LUT[d[i+1]],b=LUT[d[i+2]];n++;
    if(useLab){const q=lin2lab(r,g,b);a0+=q[0];a1+=q[1];a2+=q[2]}else{a0+=r;a1+=g;a2+=b}}
  if(!n){showResult(null);return}
  a0/=n;a1/=n;a2/=n;
  const lab=useLab?[a0,a1,a2]:lin2lab(a0,a1,a2);
  const rgb=lab2lin(...lab),C=Math.hypot(lab[1],lab[2]);
  let h=Math.atan2(lab[2],lab[1])*180/Math.PI;if(h<0)h+=360;
  showResult({L:lab[0],C,h,hex:hex(...rgb),rgb:rgb.map(v=>Math.min(1,Math.max(0,v))),n})}
$('space').onchange=()=>{if(full)compute()};

function css(c){return`oklch(${(c.L*100).toFixed(1)}% ${c.C.toFixed(4)} ${c.C<.002?'none':c.h.toFixed(1)})`}
function showResult(c){
  cur=c;
  $('sw').style.background=c?c.hex:'transparent';
  $('rL').textContent=c?c.L.toFixed(4)+'  ('+(c.L*100).toFixed(1)+'%)':'–';
  $('rC').textContent=c?c.C.toFixed(4):'–';
  $('rH').textContent=c?(c.C<.002?'n/a (near gray)':c.h.toFixed(1)+'°'):'–';
  $('rX').textContent=c?c.hex:'–';
  $('rS').textContent=c?c.rgb.map(enc).join(', ')+'  (0–255)':'–';
  $('rLin').textContent=c?c.rgb.map(v=>v.toFixed(4)).join(', ')+'  (0–1)':'–';
  $('rN').textContent=c?c.n.toLocaleString('en-US'):'–'}

/* ---- copy + saved list ---- */
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}}
const flash=(b,t)=>{const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,900)};
$('cpy').onclick=e=>{if(cur){copy(css(cur));flash(e.target,'Copied')}};
$('save').onclick=()=>{if(!cur)return;saved.push(cur);drawList()};
function drawList(){
  const box=$('list');box.innerHTML='';
  if(!saved.length){box.innerHTML='<span class="muted">Nothing saved yet.</span>';return}
  saved.forEach((c,i)=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<i style="background:${c.hex}"></i><span class="mono">${css(c)}</span>`;
    r.title='Click to copy';r.onclick=()=>copy(css(c));box.appendChild(r)})}
</script>
</body>
</html>
